{% extends "base.html" %}
{% block title %}Sent{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-megaphone"></i> Sent Messages</h1>
</div>

<div class="card">
    <div class="list-group list-group-flush">
        {% for msg in messages_list %}
        <a href="{% url 'communications:read_message' msg.pk %}" class="list-group-item list-group-item-action">
            <div class="d-flex justify-content-between">
                <div>
                    <h6 class="mb-1">{{ msg.subject }}</h6>
                    <small class="text-muted">To: {{ msg.recipient.get_full_name }}</small>
                </div>
                <small class="text-muted">{{ msg.sent_at|date:"M d, H:i" }}</small>
            </div>
        </a>
        {% empty %}
        <div class="p-4 text-center text-muted">No sent messages.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
