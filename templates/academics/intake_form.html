{% extends "base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-people-plus me-2"></i>{{ title }}</h1>
    <p class="text-muted mb-0">Manage intake information</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Intake Code</label>
                    {{ form.code }}
                    <div class="form-text">e.g., "AUG2026", "JAN2027"</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Intake Name</label>
                    {{ form.name }}
                    <div class="form-text">e.g., "August 2026 Intake"</div>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i>Save Intake
                </button>
                <a href="{% url 'academics:intake_list' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to Intakes
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
