{% extends "base.html" %}
{% block title %}Compose{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-megaphone"></i> Compose Message</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">To</label>
                    <select name="recipient" class="form-select" required>
                        <option value="">Select recipient...</option>
                        {% for u in users %}<option value="{{ u.id }}">{{ u.get_full_name }} ({{ u.get_role_display }})</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea name="body" class="form-control" rows="6" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i> Send</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
