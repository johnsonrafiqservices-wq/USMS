{% extends "base.html" %}
{% block title %}Issue Book{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-journal-bookmark"></i> Issue Book</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Book</label>
                    <select name="book" class="form-select" required>
                        <option value="">Select a book...</option>
                        {% for book in books %}<option value="{{ book.id }}">{{ book.title }} ({{ book.available_copies }} avail.)</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Borrower</label>
                    <select name="borrower" class="form-select" required>
                        <option value="">Select user...</option>
                        {% for u in users %}<option value="{{ u.id }}">{{ u.get_full_name }} ({{ u.username }})</option>{% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check me-1"></i> Issue Book</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
