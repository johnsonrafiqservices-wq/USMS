{% csrf_token %}
<div class="row g-4">
    <div class="col-lg-8">
        {# Student + session #}
        <div class="card p-4 mb-4">
            <h6 class="fw-bold mb-3" style="font-size:.8rem;letter-spacing:.6px;text-transform:uppercase;color:#1e3a5f;border-bottom:2px solid #1e3a5f;display:inline-block;padding-bottom:3px;">Invoice Details</h6>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Student <span class="text-danger">*</span></label>
                    <select name="student" class="form-select" required>
                        <option value="">— Select Student —</option>
                        {% for s in students %}
                        <option value="{{ s.pk }}">{{ s.student_id }} — {{ s.user.get_full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Academic Session <span class="text-danger">*</span></label>
                    <select name="session" class="form-select" required>
                        <option value="">— Select Session —</option>
                        {% for s in sessions %}
                        <option value="{{ s.pk }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Semester <span class="text-muted">(optional)</span></label>
                    <select name="semester" class="form-select">
                        <option value="">— All Semesters —</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Due Date</label>
                    <input type="date" name="due_date" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Notes</label>
                    <textarea name="notes" class="form-control" rows="2" placeholder="Optional notes…"></textarea>
                </div>
            </div>
        </div>

        {# Line items #}
        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0" style="font-size:.8rem;letter-spacing:.6px;text-transform:uppercase;color:#1e3a5f;border-bottom:2px solid #1e3a5f;display:inline-block;padding-bottom:3px;">Invoice Items</h6>
                <button type="button" class="btn btn-sm btn-outline-primary" onclick="addItem()">
                    <i class="bi bi-plus me-1"></i>Add Item
                </button>
            </div>

            <div id="itemsContainer">
                <div class="item-row">
                    <div class="row g-2 align-items-center">
                        <div class="col-md-7">
                            <input type="text" name="description" class="form-control form-control-sm" placeholder="Description (e.g. Tuition Fee)" required>
                        </div>
                        <div class="col-md-4">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text">UGX</span>
                                <input type="number" name="amount" class="form-control amount-input" step="1" min="0" placeholder="0" required onchange="updateTotal()">
                            </div>
                        </div>
                        <div class="col-md-1 text-end">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeItem(this)" disabled>
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3 p-3 bg-light rounded d-flex justify-content-between align-items-center">
                <span class="fw-bold">Total Amount</span>
                <span class="fw-bold text-primary" style="font-size:1.2rem;" id="totalDisplay">UGX 0</span>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card p-4">
            <h6 class="fw-bold mb-3" style="font-size:.8rem;letter-spacing:.6px;text-transform:uppercase;color:#1e3a5f;">Summary</h6>
            <p class="text-muted small">Fill in the student, session, and line items, then click <strong>Create Invoice</strong>.</p>
            <hr>
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Items</span>
                <span id="itemCount">1</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
                <span class="text-muted">Total</span>
                <strong id="summaryTotal">UGX 0</strong>
            </div>
        </div>
    </div>
</div>

<style>
  .item-row { background:#f8f9fa; border-radius:6px; padding:12px 14px; margin-bottom:8px; }
</style>

<script>
function addItem() {
    const container = document.getElementById('itemsContainer');
    const div = document.createElement('div');
    div.className = 'item-row';
    div.innerHTML = `
        <div class="row g-2 align-items-center">
            <div class="col-md-7">
                <input type="text" name="description" class="form-control form-control-sm" placeholder="Description" required>
            </div>
            <div class="col-md-4">
                <div class="input-group input-group-sm">
                    <span class="input-group-text">UGX</span>
                    <input type="number" name="amount" class="form-control amount-input" step="1" min="0" placeholder="0" required onchange="updateTotal()">
                </div>
            </div>
            <div class="col-md-1 text-end">
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="removeItem(this)">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>`;
    container.appendChild(div);
    updateTotal();
}

function removeItem(btn) {
    btn.closest('.item-row').remove();
    updateTotal();
}

function updateTotal() {
    const inputs = document.querySelectorAll('.amount-input');
    let total = 0;
    inputs.forEach(i => total += parseFloat(i.value) || 0);
    const fmt = 'UGX ' + total.toLocaleString();
    document.getElementById('totalDisplay').textContent = fmt;
    document.getElementById('summaryTotal').textContent = fmt;
    document.getElementById('itemCount').textContent = inputs.length;
}
</script>
