<div class="border rounded p-3 bg-white">
    <h6 class="mb-3">Create Lecturer</h6>
    <form id="staffCreateForm">
        <div class="row g-2">
            <div class="col-md-6">
                <label class="form-label">Username</label>
                {{ form.username }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                {{ form.email }}
            </div>
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                {{ form.first_name }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                {{ form.last_name }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Staff ID</label>
                {{ form.staff_id }}
            </div>
            <div class="col-md-6">
                <label class="form-label">Department</label>
                {{ form.department }}
            </div>
            <div class="col-12 text-end mt-2">
                <button type="button" class="btn btn-sm btn-primary" id="submitStaffCreateBtn">Create Lecturer</button>
            </div>
        </div>
    </form>
</div>
