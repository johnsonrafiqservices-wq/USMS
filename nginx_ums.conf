server {
    listen 80;
    server_name 172.16.61.77 localhost 127.0.0.1;

    # Django static files
    location /static/ {
        alias C:/Users/it.sm.UG-EMERGENCY/Desktop/uni/hospital_meal_system/ums/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django media files
    location /media/ {
        alias C:/Users/it.sm.UG-EMERGENCY/Desktop/uni/hospital_meal_system/ums/media/;
    }

    # Proxy to Django Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
