{% extends "base.html" %}
{% block title %}New Announcement{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-megaphone"></i> Create Announcement</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea name="content" class="form-control" rows="5" required></textarea>
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Target Audience</label>
                        <select name="target_audience" class="form-select">
                            <option value="all">Everyone</option>
                            <option value="students">Students Only</option>
                            <option value="staff">Staff Only</option>
                            <option value="lecturers">Lecturers Only</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Priority</label>
                        <select name="priority" class="form-select">
                            <option value="normal">Normal</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3"><i class="bi bi-megaphone me-1"></i> Publish</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
