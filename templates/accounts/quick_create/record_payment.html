{% csrf_token %}
<div class="row g-3">
    <div class="col-12">
        <label class="form-label">Invoice <span class="text-danger">*</span></label>
        <select name="invoice" class="form-select" required>
            <option value="">— Select Invoice —</option>
            {% for inv in invoices %}
            <option value="{{ inv.pk }}">{{ inv.invoice_number }} — {{ inv.student.user.get_full_name }} (Balance: {{ inv.balance|floatformat:0 }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-sm-6">
        <label class="form-label">Amount (UGX) <span class="text-danger">*</span></label>
        <input type="number" name="amount" class="form-control" min="0" step="0.01" placeholder="0.00" required>
    </div>
    <div class="col-sm-6">
        <label class="form-label">Payment Method <span class="text-danger">*</span></label>
        <select name="payment_method" class="form-select" required>
            {% for val, lbl in methods %}
            <option value="{{ val }}">{{ lbl }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-sm-6">
        <label class="form-label">Reference / Receipt No.</label>
        <input type="text" name="reference_number" class="form-control" placeholder="Bank ref, mobile money code…">
    </div>
    <div class="col-sm-6">
        <label class="form-label">Notes</label>
        <input type="text" name="notes" class="form-control" placeholder="Optional note">
    </div>
</div>
