{% extends "base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title"><i class="bi bi-calendar3 me-2"></i>{{ title }}</h1>
    <p class="text-muted mb-0">Manage academic session information</p>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Session Name</label>
                    {{ form.name }}
                    <div class="form-text">e.g., "2026/2027"</div>
                </div>
                <div class="col-md-4">
                    <div class="form-check mt-4">
                        {{ form.is_current }}
                        <label class="form-check-label" for="{{ form.is_current.id_for_label }}">Current Session</label>
                    </div>
                    <div class="form-text">Only one session can be current</div>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i>Save Session
                </button>
                <a href="{% url 'academics:session_list' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>Back to Sessions
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
